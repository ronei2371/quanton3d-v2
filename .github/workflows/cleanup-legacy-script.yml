name: Remover script legado (item-56)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deletar arquivo com nome de commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm "quanton3dbackend/scripts/feat(item-43): add migration script for MongoDB images to R2"
          git commit -m "chore(item-56): remover script legado renomeado para migrarParaR2.js"
          git push
