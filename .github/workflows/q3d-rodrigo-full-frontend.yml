name: Temporary Rodrigo full frontend integration

on:
  push:
    branches:
      - feature/v3-visual-preserva-rag
    paths:
      - .github/workflows/q3d-rodrigo-full-frontend.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch de teste
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar frontend completo do Rodrigo
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          rm -rf /tmp/rodrigo-src /tmp/rodrigo-images /tmp/rodrigo-motions /tmp/rodrigo-docs /tmp/rodrigo-academy
          mkdir -p /tmp/rodrigo-src /tmp/rodrigo-images /tmp/rodrigo-motions /tmp/rodrigo-docs /tmp/rodrigo-academy

          # Código completo do frontend entregue pelo Rodrigo.
          gdown --folder "https://drive.google.com/drive/folders/1r9BNRxM6gkPkaq4ITzfKO_gohV8qEAGH" -O /tmp/rodrigo-src
          # Assets visuais.
          gdown --folder "https://drive.google.com/drive/folders/1yjxCty4sn5MZKgwGhoBbterObSKQqTwD" -O /tmp/rodrigo-images
          gdown --folder "https://drive.google.com/drive/folders/16b_Zo9Gxv50HQq8ckZXHiohjRgsk5Hpw" -O /tmp/rodrigo-motions
          # PDFs e novos conteúdos Academy acessíveis sem tocar no backend.
          gdown --folder "https://drive.google.com/drive/folders/1lgJcjBifKCD15ID4fSv1KV4y6wPavat2" -O /tmp/rodrigo-docs
          gdown --folder "https://drive.google.com/drive/folders/1pzLoOEzOrfOanF98VUd40LT9G03U2wlU" -O /tmp/rodrigo-academy

          SRC_APP=$(find /tmp/rodrigo-src -type f -name App.jsx | head -1)
          IMG_HERO=$(find /tmp/rodrigo-images -type f -name foto_hero_site.png | head -1)
          MOTION_ATOM=$(find /tmp/rodrigo-motions -type f -name simbolo-atomo-quanton3d.json | head -1)
          test -n "$SRC_APP"
          test -n "$IMG_HERO"
          test -n "$MOTION_ATOM"

          echo "RODRIGO_SRC=$(dirname "$SRC_APP")" >> "$GITHUB_ENV"
          echo "RODRIGO_IMAGES=$(dirname "$IMG_HERO")" >> "$GITHUB_ENV"
          echo "RODRIGO_MOTIONS=$(dirname "$MOTION_ATOM")" >> "$GITHUB_ENV"
          echo "RODRIGO_DOCS=$(find /tmp/rodrigo-docs -type f -name IRON.pdf -printf '%h\n' | head -1)" >> "$GITHUB_ENV"
          echo "RODRIGO_ACADEMY=$(find /tmp/rodrigo-academy -type f -name 'hero_quanton3d_lab_v5.png' -printf '%h\n' | head -1)" >> "$GITHUB_ENV"

      - name: Aplicar tudo que pertence ao frontend do Rodrigo
        shell: bash
        run: |
          set -euo pipefail
          TARGET="quanton3dfrontend"

          # Faz overlay de TODO o src do Rodrigo: textos, páginas, calculadoras,
          # navegação, Academy, catálogo, comunidade, atendimento, estilos etc.
          # Não apagamos os arquivos exclusivos do original para poder religar RAG/IA.
          cp -R "$RODRIGO_SRC/." "$TARGET/src/"

          mkdir -p "$TARGET/public/images" "$TARGET/public/motions" "$TARGET/public/docs" "$TARGET/public/guias/academy"
          rsync -a "$RODRIGO_IMAGES/" "$TARGET/public/images/"
          rsync -a "$RODRIGO_MOTIONS/" "$TARGET/public/motions/"
          if [[ -n "${RODRIGO_DOCS:-}" && -d "$RODRIGO_DOCS" ]]; then rsync -a "$RODRIGO_DOCS/" "$TARGET/public/docs/"; fi
          if [[ -n "${RODRIGO_ACADEMY:-}" && -d "$RODRIGO_ACADEMY" ]]; then rsync -a "$RODRIGO_ACADEMY/" "$TARGET/public/guias/academy/"; fi

      - name: Recolocar somente o cérebro original RAG e IA
        shell: bash
        run: |
          set -euo pipefail
          TARGET="quanton3dfrontend"

          # O frontend do Rodrigo passa a usar a mesma API original do site ativo.
          mkdir -p "$TARGET/src/lib"
          cat > "$TARGET/src/lib/api.js" <<'EOF'
          export { default } from "../api";
          EOF

          # A janela segue o visual do Rodrigo, mas o conteúdo é o BotContent
          # original, que conversa com /api/chat e portanto com RAG + IA ativos.
          cat > "$TARGET/src/components/modals/BotModal.jsx" <<'EOF'
          import { Bot, X } from "lucide-react";
          import BotContent from "../BotContent";

          function BotModal({ cliente, onClose }) {
            return (
              <div className="q-modal-backdrop">
                <section className="q-modal" style={{ width: "98vw", maxWidth: "760px", height: "88vh", maxHeight: "88vh", padding: "18px 20px", display: "flex", flexDirection: "column", overflow: "hidden" }}>
                  <div className="q-modal-head">
                    <h2 style={{ display: "flex", alignItems: "center", gap: "8px", fontSize: "1rem" }}>
                      <Bot size={18} color="var(--primary)" /> IAQ3D — Assistente Técnico Quanton3D
                    </h2>
                    <button type="button" className="q-modal-close" onClick={onClose}><X size={13} /> Fechar</button>
                  </div>
                  <div style={{ flex: 1, minHeight: 0 }}><BotContent cliente={cliente} /></div>
                </section>
              </div>
            );
          }
          export default BotModal;
          EOF

      - name: Garantir dependências do frontend do Rodrigo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("quanton3dfrontend/package.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          deps = data.setdefault("dependencies", {})
          deps["lottie-web"] = "^5.13.0"
          deps["lucide-react"] = "^1.25.0"
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Provar que backend RAG e IA originais não mudaram
        shell: bash
        run: |
          set -euo pipefail
          protected=(
            quanton3dbackend
            render.yaml
            quanton3dfrontend/src/api.js
            quanton3dfrontend/src/components/BotContent.jsx
            quanton3dfrontend/src/utils.js
          )
          if ! git diff --quiet HEAD -- "${protected[@]}"; then
            echo "ERRO: um arquivo protegido do cérebro original foi alterado."
            git diff -- "${protected[@]}"
            exit 1
          fi
          echo "OK: backend, RAG, IA, cliente API original e BotContent estão intactos."

      - name: Validar build do frontend completo integrado
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix quanton3dfrontend
          npm run build --prefix quanton3dfrontend

      - name: Salvar somente na branch de teste
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/q3d-rodrigo-full-frontend.yml
          git config user.name "Quanton3D Rodrigo Integration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: use complete Rodrigo frontend with original RAG and AI [skip ci]"
          git push
