name: Temporary Quanton3D v3 visual transfer

on:
  push:
    branches:
      - feature/v3-visual-preserva-rag
    paths:
      - .github/workflows/q3d-v3-visual-transfer.yml

permissions:
  contents: write

jobs:
  transfer-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch de integração
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar somente os arquivos visuais necessários
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          rm -rf /tmp/q3d-src /tmp/q3d-images /tmp/q3d-motions
          mkdir -p /tmp/q3d-src /tmp/q3d-images /tmp/q3d-motions

          # src do projeto visual (sem backend)
          gdown --folder "https://drive.google.com/drive/folders/1r9BNRxM6gkPkaq4ITzfKO_gohV8qEAGH" -O /tmp/q3d-src
          # imagens do novo visual
          gdown --folder "https://drive.google.com/drive/folders/1yjxCty4sn5MZKgwGhoBbterObSKQqTwD" -O /tmp/q3d-images
          # animação do átomo
          gdown --folder "https://drive.google.com/drive/folders/16b_Zo9Gxv50HQq8ckZXHiohjRgsk5Hpw" -O /tmp/q3d-motions

          SRC_APP=$(find /tmp/q3d-src -type f -name App.jsx | head -1)
          IMG_HERO=$(find /tmp/q3d-images -type f -name foto_hero_site.png | head -1)
          MOTION_ATOM=$(find /tmp/q3d-motions -type f -name simbolo-atomo-quanton3d.json | head -1)
          test -n "$SRC_APP"
          test -n "$IMG_HERO"
          test -n "$MOTION_ATOM"

          echo "SRC_DIR=$(dirname "$SRC_APP")" >> "$GITHUB_ENV"
          echo "IMAGES_DIR=$(dirname "$IMG_HERO")" >> "$GITHUB_ENV"
          echo "MOTIONS_DIR=$(dirname "$MOTION_ATOM")" >> "$GITHUB_ENV"

      - name: Transferir somente a camada visual para o frontend original
        shell: bash
        run: |
          set -euo pipefail
          TARGET="quanton3dfrontend"

          cp "$SRC_DIR/App.jsx" "$TARGET/src/App.jsx"
          cp "$SRC_DIR/App.css" "$TARGET/src/App.css"
          cp "$SRC_DIR/main.jsx" "$TARGET/src/main.jsx"

          rm -rf "$TARGET/src/styles" "$TARGET/src/data"
          mkdir -p "$TARGET/src/styles" "$TARGET/src/data"
          cp -R "$SRC_DIR/styles/." "$TARGET/src/styles/"
          cp -R "$SRC_DIR/data/." "$TARGET/src/data/"

          for dir in layout sections guides modals calculators; do
            rm -rf "$TARGET/src/components/$dir"
            mkdir -p "$TARGET/src/components/$dir"
            cp -R "$SRC_DIR/components/$dir/." "$TARGET/src/components/$dir/"
          done

          if [[ -f "$SRC_DIR/components/admin/admin-legacy.css" ]]; then
            cp "$SRC_DIR/components/admin/admin-legacy.css" "$TARGET/src/styles/admin-legacy.css"
          fi

          mkdir -p "$TARGET/public/images" "$TARGET/public/motions"
          rsync -a "$IMAGES_DIR/" "$TARGET/public/images/"
          rsync -a "$MOTIONS_DIR/" "$TARGET/public/motions/"

      - name: Manter RAG IA backend e funções originais
        shell: bash
        run: |
          set -euo pipefail
          TARGET="quanton3dfrontend"

          mkdir -p "$TARGET/src/lib"
          cat > "$TARGET/src/lib/api.js" <<'EOF'
          export { default } from "../api";
          EOF
          rm -f "$TARGET/src/lib/parametrosFallback.js"

          # Novo visual por fora, BotContent ORIGINAL por dentro.
          cat > "$TARGET/src/components/modals/BotModal.jsx" <<'EOF'
          import { Bot, X } from "lucide-react";
          import BotContent from "../BotContent";

          function BotModal({ cliente, onClose }) {
            return (
              <div className="q-modal-backdrop">
                <section className="q-modal" style={{ width: "98vw", maxWidth: "760px", height: "88vh", maxHeight: "88vh", padding: "18px 20px", display: "flex", flexDirection: "column", overflow: "hidden" }}>
                  <div className="q-modal-head">
                    <h2 style={{ display: "flex", alignItems: "center", gap: "8px", fontSize: "1rem" }}>
                      <Bot size={18} color="var(--primary)" /> IAQ3D — Assistente Técnico Quanton3D
                    </h2>
                    <button type="button" className="q-modal-close" onClick={onClose}><X size={13} /> Fechar</button>
                  </div>
                  <div style={{ flex: 1, minHeight: 0 }}><BotContent cliente={cliente} /></div>
                </section>
              </div>
            );
          }
          export default BotModal;
          EOF
          rm -f "$TARGET/src/components/modals/BotChat.jsx"

          # Admin e Atendente continuam originais.
          cat > "$TARGET/src/components/modals/AdminModal.jsx" <<'EOF'
          import { X } from "lucide-react";
          import AdminContent from "../AdminContent";
          import PainelAtendente from "../PainelAtendente";

          function AdminModal({ atendenteLogado, onClose }) {
            const acessoCompleto = atendenteLogado?.permissoes?.acessoAdmCompleto;
            const tokenAtendente = acessoCompleto ? localStorage.getItem("quanton3d_atendente_token") : null;
            return (
              <div className="q-modal-backdrop">
                <section className="q-modal q-modal--wide" style={{ display: "flex", flexDirection: "column" }}>
                  <div className="q-modal-head">
                    <h2 style={{ fontSize: "1.05rem" }}>{atendenteLogado && !acessoCompleto ? "Painel do Atendente" : "Painel Administrativo"}</h2>
                    <button type="button" className="q-modal-close" onClick={onClose}><X size={13} /> Fechar</button>
                  </div>
                  <div style={{ flex: 1, overflowY: "auto" }}>
                    {atendenteLogado && !acessoCompleto ? <PainelAtendente atendente={atendenteLogado} onClose={onClose} /> : <AdminContent tokenAtendente={tokenAtendente} />}
                  </div>
                </section>
              </div>
            );
          }
          export default AdminModal;
          EOF

          # Formulários originais continuam gravando no backend original.
          cat > "$TARGET/src/components/modals/ContactMessageModal.jsx" <<'EOF'
          export { default } from "../ContactMessageModal";
          EOF
          cat > "$TARGET/src/components/modals/PartnerRequestModal.jsx" <<'EOF'
          export { default } from "../PartnerRequestModal";
          EOF

          # Calculadoras: visual novo, cálculo original.
          for name in CalculadoraCompensacao CalculadoraCustos CalculadoraExposicao CalculadoraTempo CalculadoraTolerancia CalculadoraVolume; do
            printf 'export { default } from "../%s";\n' "$name" > "$TARGET/src/components/calculators/$name.jsx"
          done

          if [[ -f "$TARGET/src/styles/admin-legacy.css" ]]; then
            grep -q 'admin-legacy.css' "$TARGET/src/main.jsx" || sed -i '/calculators.css/a import "./styles/admin-legacy.css";' "$TARGET/src/main.jsx"
          fi

      - name: Adicionar somente dependências visuais necessárias
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("quanton3dfrontend/package.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          deps = data.setdefault("dependencies", {})
          deps["lottie-web"] = "^5.13.0"
          deps["lucide-react"] = "^1.25.0"
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Garantir que o núcleo original não foi tocado
        shell: bash
        run: |
          set -euo pipefail
          protected=(
            quanton3dbackend
            render.yaml
            quanton3dfrontend/src/api.js
            quanton3dfrontend/src/components/BotContent.jsx
            quanton3dfrontend/src/components/AdminContent.jsx
            quanton3dfrontend/src/components/PainelAtendente.jsx
            quanton3dfrontend/src/components/ContactMessageModal.jsx
            quanton3dfrontend/src/components/PartnerRequestModal.jsx
            quanton3dfrontend/src/utils.js
          )
          if ! git diff --quiet HEAD -- "${protected[@]}"; then
            echo "ERRO: arquivo protegido de lógica/backend foi alterado."
            git diff -- "${protected[@]}"
            exit 1
          fi
          echo "OK: backend, RAG, IA e lógica protegida permanecem idênticos ao original."

      - name: Validar build da integração
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix quanton3dfrontend
          npm run build --prefix quanton3dfrontend

      - name: Salvar somente na branch de teste
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/q3d-v3-visual-transfer.yml
          git config user.name "Quanton3D Visual Transfer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply v3 visual preserving original RAG and AI [skip ci]"
          git push
