<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="Cavidade selada: ao subir a plataforma, o volume preso vira uma ventosa e puxa a peça contra o filme FEP">
  <title>Cavidade selada: ao subir a plataforma, o volume preso vira uma ventosa e puxa a peça contra o filme FEP</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1830"/><stop offset="1" stop-color="#060b16"/></linearGradient>
    <linearGradient id="peca" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d97a3"/><stop offset=".45" stop-color="#c9d1da"/><stop offset="1" stop-color="#737d89"/></linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aab3bd"/><stop offset="1" stop-color="#5d6773"/></linearGradient>
    <linearGradient id="resina" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8cff" stop-opacity=".22"/><stop offset="1" stop-color="#2f8cff" stop-opacity=".42"/></linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d4dff" stop-opacity=".9"/><stop offset="1" stop-color="#2a1560"/></linearGradient>
    <marker id="setaA" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fd0ff"/></marker>
    <marker id="setaV" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5a64"/></marker>
    <marker id="setaB" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8e2f2"/></marker>
    
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <!-- tanque com resina -->
  <path d="M40 132 V262 H600 V132" fill="none" stroke="#3b4a66" stroke-width="3"/>
  <rect x="42" y="150" width="556" height="112" fill="url(#resina)"/>
  <line x1="42" y1="150" x2="598" y2="150" stroke="#5fb2ff" stroke-opacity=".6" stroke-width="1.5"/>
  <!-- tela LCD -->
  <rect x="40" y="268" width="560" height="14" rx="3" fill="url(#lcd)"/>
  <text x="48" y="304" fill="#9fb0cc" font-family="Segoe UI, Arial, sans-serif" font-size="13">Tela LCD</text>
  <!-- plataforma -->
  <rect x="150" y="24" width="340" height="24" rx="4" fill="url(#plat)"/>
  <text x="160" y="17" fill="#9fb0cc" font-family="Segoe UI, Arial, sans-serif" font-size="13">Plataforma</text>
  <line x1="520" y1="62" x2="520" y2="22" stroke="#d8e2f2" stroke-width="3" marker-end="url(#setaB)"/>
  <text x="532" y="46" fill="#d8e2f2" font-family="Segoe UI, Arial, sans-serif" font-size="13">sobe</text>
  <!-- peca oca (corte) -->
  <path d="M200 48 H440 V262 H414 V80 H226 V262 H200 Z" fill="url(#peca)" stroke="#4e5763" stroke-width="1.5"/>
  <rect x="226" y="80" width="188" height="176" fill="#12305e" fill-opacity=".85"/>
  <g stroke="#ff5a64" stroke-width="4" marker-end="url(#setaV)">
    <line x1="270" y1="100" x2="270" y2="168"/>
    <line x1="320" y1="100" x2="320" y2="176"/>
    <line x1="370" y1="100" x2="370" y2="168"/>
  </g>
  <rect x="254" y="190" width="132" height="26" rx="13" fill="#3a0e18" stroke="#ff5a64" stroke-width="1.5"/>
  <text x="320" y="208" text-anchor="middle" fill="#ffd2d5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">vácuo: ventosa</text>
  <path d="M42 262 H226 Q320 238 414 262 H598" fill="none" stroke="#9fd3ff" stroke-width="3"/>
  <path d="M230 258 Q320 236 410 258" fill="none" stroke="#ff5a64" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="592" y="256" text-anchor="end" fill="#9fd3ff" font-family="Segoe UI, Arial, sans-serif" font-size="13">Filme FEP</text>
  <text x="60" y="190" fill="#ffb3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">sem entrada</text>
  <text x="60" y="206" fill="#ffb3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">de ar ou resina</text>
  <circle cx="594" cy="96" r="18" fill="#3a0e18" stroke="#ff5a64" stroke-width="2"/>
  <path d="M586 88 L602 104 M602 88 L586 104" stroke="#ff5a64" stroke-width="3" stroke-linecap="round"/>
</svg>
